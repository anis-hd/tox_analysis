version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb_container
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    container_name: fastapi_toxicity_app
    restart: always
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - DB_NAME=toxicity_db
      - PORT=8000
      - HOST=0.0.0.0
      - MODEL_NAME=EIStakovskii/french_toxicity_classifier_plus_v2
    ports:
      - "8000:8000"
    depends_on:
      - mongodb

volumes:
  mongo_data:
